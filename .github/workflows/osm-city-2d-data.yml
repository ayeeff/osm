name: OSM city 2D map data

# Builds places.json + demand-streets.json for the 2D dark city map style
# (ayeeff/astrogl â†’ template/map-style-2d.md) from the per-country OSM extracts
# already staged in R2. No Overpass: one streamed country extract per city,
# scanned locally by osmium in the runner.
#
# Output lands in BOTH buckets:
#   geo-datalake/sources/osm/places/<slug>/   durable copy
#   globe/data/<slug>-2d/                     what the site Worker serves

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "City slug; empty processes every city in cities.json"
        required: false
        default: ""
      publish:
        description: Publish to the live globe/data prefix
        type: boolean
        required: false
        default: true
      rebuild_site:
        description: Trigger an astrogl Workers Build so the atlas pages are rebuilt
        type: boolean
        required: false
        default: true
  schedule:
    # Weekly, alongside the geofabrik extract refresh.
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: osm-city-2d-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cities: ${{ steps.plan.outputs.cities }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      REQUESTED_SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the city matrix
        id: plan
        run: |
          set -euo pipefail
          # Only cities that name a geofabrik extract can be built here; the rest
          # keep using the atlas-2d-worker Overpass fallback.
          ALL=$(jq -c '[.cities[] | select(.extract != null and .extract != "")]' cities.json)
          if [ -n "$REQUESTED_SLUG" ]; then
            PICK=$(jq -c --arg s "$REQUESTED_SLUG" '[.[] | select(.slug == $s)]' <<<"$ALL")
            if [ "$(jq 'length' <<<"$PICK")" -eq 0 ]; then
              echo "::error::slug '$REQUESTED_SLUG' has no 'extract' in cities.json (or is unknown) â€” it would fall back to Overpass"
              exit 1
            fi
            ALL="$PICK"
          fi
          echo "cities=$ALL" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.slug) -> \(.extract)"' <<<"$ALL"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        city: ${{ fromJSON(needs.plan.outputs.cities) }}
    env:
      SLUG: ${{ matrix.city.slug }}
      LABEL: ${{ matrix.city.label }}
      EXTRACT: ${{ matrix.city.extract }}
      # osmium -b takes minLat,minLon,maxLat,maxLon
      BBOX: ${{ join(matrix.city.bbox, ',') }}
      # matrix.city.bbox is [minLng, minLat, maxLng, maxLat], which is exactly
      # what `osmium extract -b` wants (LONG1,LAT1,LONG2,LAT2) â€” pass it through.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == false && 'false' || 'true' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium + pyosmium
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip3 install --break-system-packages --quiet osmium

      - name: Configure R2
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"

      - name: Fetch the country extract
        run: |
          set -euo pipefail
          mkdir -p work
          SOURCE_KEY="sources/osm/${EXTRACT}-latest.osm.pbf"
          SIZE=$(aws s3api head-object --bucket geo-datalake --key "$SOURCE_KEY" \
            --query 'ContentLength' --output text)
          printf 'source=%s (%s bytes)\n' "$SOURCE_KEY" "$SIZE"
          # This is runner disk inside GitHub Actions, not the operator's home
          # link â€” a 1.5 GB country extract is nothing here, and having the file
          # on disk makes the osmium steps debuggable and re-runnable.
          aws s3 cp "s3://geo-datalake/${SOURCE_KEY}" work/source.osm.pbf \
            --no-progress --only-show-errors
          ls -l work/source.osm.pbf
          osmium fileinfo work/source.osm.pbf | head -n 4

      - name: Score places, street demand and neighborhood outlines
        run: |
          set -euo pipefail
          # Read the WHOLE country extract and filter by bbox in Python.
          #
          # Do NOT pre-cut it with `osmium extract`. Its default `simple`
          # strategy drops the member ways of relations, and — separately — the
          # overwhelming majority of real administrative boundaries are legacy
          # `type=boundary` relations, which libosmium's area assembler does not
          # build at all (it only handles `type=multipolygon`). Together those
          # two cost us 191 of Berlin's 203 neighborhood outlines.
          #
          # matrix.city.bbox is [minLng, minLat, maxLng, maxLat].
          printf 'pbf=work/source.osm.pbf bbox=%s\n' "$BBOX"
          python scripts/extract_city_2d_data.py \
            --slug "$SLUG" --extract "$EXTRACT" \
            --pbf work/source.osm.pbf --bbox "$BBOX" \
            --out-dir "work/out/${SLUG}"
          rm -f work/source.osm.pbf

      - name: Upload
        run: |
          set -euo pipefail
          aws s3 sync "work/out/${SLUG}/" "s3://geo-datalake/sources/osm/places/${SLUG}/" \
            --exclude "*" --include "*.json"
          if [ "$PUBLISH" = "true" ]; then
            for f in places.json demand-streets.json neighborhoods.json; do
              aws s3 cp "work/out/${SLUG}/$f" \
                "s3://globe/data/${SLUG}-2d/$f" --content-type application/json
            done
          else
            echo "staged only (publish=false)"
          fi
          rm -rf work/source.osm.pbf work/city.osm.pbf

      - name: Summary
        if: always()
        run: cat "work/out/${SLUG}/_manifest.json" 2>/dev/null || echo "no manifest"

  # Rebuild the astrogl site's *-city-atlas / *-expensive-suburbs pages after the
  # data lands.
  #
  # The pages fetch /data/<slug>-2d/*.json at RUNTIME through the site Worker, so
  # a data-only change is already live the moment the upload lands and this step
  # is strictly redundant for correctness. It exists because a rebuild also
  # re-prerenders the atlas HTML, so a newly enrolled city shows up in the page
  # shell, the sitemap and the prerendered routes rather than only in the data.
  #
  # Cloudflare Workers Builds normally fires on a git push; this posts to the
  # Builds API instead. Sequence: list triggers for the worker tag -> pick the
  # one that includes the branch -> POST a manual build.
  rebuild-site:
    needs: [plan, build]
    # Always on the weekly schedule; on a manual run unless rebuild_site=false.
    if: needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_site != false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SITE_TRIGGER_UUID: ${{ vars.SITE_TRIGGER_UUID }}
      SITE_BRANCH: preview
      API: https://api.cloudflare.com/client/v4
    steps:
      - name: Trigger a Workers Build for astrogl
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$SITE_TRIGGER_UUID" ]; then
            echo "::notice::CF_API_TOKEN / SITE_TRIGGER_UUID not configured — skipping the site rebuild"
            exit 0
          fi
          # A file, not an inline -d string: a shell mangles the embedded quotes
          # and the API answers 400 "Invalid request body".
          printf '{"branch":"%s","commit_message":"ayeeff/osm 2d data published","commit_author":"ayeeff/osm"}' \
            "$SITE_BRANCH" > body.json
          UUID=$(curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @body.json \
            "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/triggers/$SITE_TRIGGER_UUID/builds" \
            | tee resp.json | jq -r '.result.build_uuid // empty')
          if [ -z "$UUID" ]; then
            echo "::error::could not start a build: $(cat resp.json)"
            exit 1
          fi
          echo "queued build $UUID for $SITE_BRANCH"

      - name: Wait for the build and report
        run: |
          set -euo pipefail
          UUID=$(jq -r '.result.build_uuid' resp.json)
          for i in $(seq 1 60); do
            sleep 30
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
              "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/builds/$UUID" > poll.json
            STATUS=$(jq -r '.result.status // "unknown"' poll.json)
            OUTCOME=$(jq -r '.result.build_outcome // "-"' poll.json)
            echo "[$i] $STATUS / $OUTCOME"
            if [ "$STATUS" = "stopped" ] || [ "$STATUS" = "error" ]; then
              if [ "$OUTCOME" = "success" ]; then exit 0; fi
              echo "::error::build $UUID finished with outcome=$OUTCOME"
              curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
                "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/builds/$UUID/logs" \
                | jq -r '.result.lines[-25:][]?[1]' || true
              exit 1
            fi
          done
          echo "::notice::build $UUID still running after 30 min — leaving it to finish"
