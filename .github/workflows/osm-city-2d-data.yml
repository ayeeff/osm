name: OSM city 2D map data

# Builds places.json + demand-streets.json for the 2D dark city map style
# (ayeeff/astrogl â†’ template/map-style-2d.md) from the per-country OSM extracts
# already staged in R2. No Overpass: one streamed country extract per city,
# scanned locally by osmium in the runner.
#
# Output lands in BOTH buckets:
#   geo-datalake/sources/osm/places/<slug>/   durable copy
#   globe/data/<slug>-2d/                     what the site Worker serves

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "City slug; empty processes every city in cities.json"
        required: false
        default: ""
      publish:
        description: Publish to the live globe/data prefix
        type: boolean
        required: false
        default: true
      rebuild_site:
        description: Trigger an astrogl Workers Build so the atlas pages are rebuilt
        type: boolean
        required: false
        default: true
  schedule:
    # Weekly, alongside the geofabrik extract refresh.
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: osm-city-2d-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cities: ${{ steps.plan.outputs.cities }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      REQUESTED_SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the city matrix
        id: plan
        run: |
          set -euo pipefail
          # Only cities that name a geofabrik extract can be built here; the rest
          # keep using the atlas-2d-worker Overpass fallback.
          ALL=$(jq -c '[.cities[] | select(.extract != null and .extract != "")]' cities.json)
          if [ -n "$REQUESTED_SLUG" ]; then
            PICK=$(jq -c --arg s "$REQUESTED_SLUG" '[.[] | select(.slug == $s)]' <<<"$ALL")
            if [ "$(jq 'length' <<<"$PICK")" -eq 0 ]; then
              echo "::error::slug '$REQUESTED_SLUG' has no 'extract' in cities.json (or is unknown) â€” it would fall back to Overpass"
              exit 1
            fi
            ALL="$PICK"
          fi
          echo "cities=$ALL" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.slug) -> \(.extract)"' <<<"$ALL"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        city: ${{ fromJSON(needs.plan.outputs.cities) }}
    env:
      SLUG: ${{ matrix.city.slug }}
      LABEL: ${{ matrix.city.label }}
      EXTRACT: ${{ matrix.city.extract }}
      # osmium -b takes minLng,minLat,maxLng,maxLat, and matrix.city.bbox is
      # already in that order.
      BBOX: ${{ join(matrix.city.bbox, ',') }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == false && 'false' || 'true' }}
      # The only sanctioned OSM source. Never reach for a public Overpass mirror.
      # See AGENTS.md "CRITICAL — No public Overpass API. Ever."
      R2_BUCKET: geo-datalake
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osmium + pyosmium
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip3 install --break-system-packages --quiet osmium

      - name: Configure R2
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"

      - name: Fetch the country extract
        run: |
          set -euo pipefail
          mkdir -p work
          SOURCE_KEY="sources/osm/${EXTRACT}-latest.osm.pbf"
          # Don't let `set -e` swallow the useful message: a missing key makes
          # head-object exit nonzero, so swallow the status and check it here.
          SIZE=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$SOURCE_KEY" \
            --query 'ContentLength' --output text 2>/dev/null) || SIZE=""
          if [ -z "$SIZE" ] || [ "$SIZE" = "None" ]; then
            echo "::error::s3://$R2_BUCKET/$SOURCE_KEY not found."
            echo "::error::Stage the country extract in sources/osm/ first."
            echo "::error::Do NOT fall back to a public Overpass mirror."
            exit 1
          fi
          printf 'source=s3://%s/%s (%s bytes)\n' "$R2_BUCKET" "$SOURCE_KEY" "$SIZE"
          # This is runner disk inside GitHub Actions, not the operator's home
          # link, so having the file on disk keeps the osmium steps debuggable.
          aws s3 cp "s3://$R2_BUCKET/$SOURCE_KEY" work/source.osm.pbf \
            --no-progress --only-show-errors
          # The QID -> population/photo cache is permanent and shared, so we ask
          # Wikidata for each item once, ever, across all cities and all runs.
          aws s3 cp "s3://$R2_BUCKET/sources/osm/wikidata-cache.json" work/wd-cache.json \
            --no-progress --only-show-errors 2>/dev/null || echo '{}' > work/wd-cache.json
          ls -l work/source.osm.pbf work/wd-cache.json
          osmium fileinfo work/source.osm.pbf | head -n 4

      - name: Cut the city with osmium (C++)
        run: |
          set -euo pipefail
          # Let osmium (C++) do the cutting, not Python.
          #
          # Reading the whole country extract with pyosmium took ~60 min for
          # germany: pyosmium streams at a few MB/s, and we made THREE passes
          # over 3.5 GB. osmium extract is two orders of magnitude faster and
          # leaves a ~100-300 MB city file, so the Python passes are cheap.
          #
          # -s complete_ways is essential. The DEFAULT strategy is `simple`,
          # which drops the member ways of any relation that crosses the
          # boundary — and relation member ways ARE the district outlines.
          #
          # BBOX is [minLng, minLat, maxLng, maxLat], which is exactly what
          # `osmium extract -b` wants.
          printf 'bbox(long1,lat1,long2,lat2)=%s\n' "$BBOX"
          time osmium extract -b "$BBOX" -s complete_ways -F pbf \
            -o work/city.osm.pbf work/source.osm.pbf
          osmium fileinfo -e work/city.osm.pbf 2>&1 | head -n 20
          rm -f work/source.osm.pbf

      - name: Score places, street demand and neighborhood outlines
        run: |
          set -euo pipefail
          time python scripts/extract_city_2d_data.py \
            --slug "$SLUG" --extract "$EXTRACT" \
            --pbf work/city.osm.pbf --bbox="$BBOX" \
            --out-dir "work/out/${SLUG}"

      - name: Attach population and photos from Wikidata
        run: |
          set -euo pipefail
          # OSM has a population tag on only a handful of the 721 Berlin
          # polygons, but 622 have a wikidata= QID, so the join rate is high.
          time python scripts/enrich_neighborhoods.py \
            --in "work/out/${SLUG}/neighborhoods.json" \
            --out "work/out/${SLUG}/neighborhoods.json" \
            --cache work/wd-cache.json

      - name: Check the city's basemap is an extract of the city
        run: |
          set -euo pipefail
          # The 2D map draws globe/basemaps/<slug>.pmtiles underneath the 2D
          # data. Nothing about a wrong archive raises: berlin.pmtiles is a
          # perfectly valid PMTiles v3 file with a real tile directory and a
          # `boundaries` layer in its TileJSON, it is just an extract of New
          # Jersey. Every tile over Berlin comes back empty and the map renders
          # blank with no error. The only way to catch it is to compare the
          # archive's own declared extent against the city.
          #
          # Fails on wrong-place so the broken city's job goes red while the
          # other matrix jobs carry on.
          python scripts/verify_city_basemap.py --slug "$SLUG" --bbox="$BBOX"

      - name: Upload
        if: always()
        run: |
          set -euo pipefail
          # Keep a copy of the output so a bad extract can be diagnosed without
          # re-reading a multi-GB country PBF.
          mkdir -p "artifact/${SLUG}"
          cp "work/out/${SLUG}"/*.json "artifact/${SLUG}/" 2>/dev/null || true
          if [ ! -d "work/out/${SLUG}" ]; then
            echo "::notice::no output for $SLUG"
            exit 0
          fi
          aws s3 sync "work/out/${SLUG}/" "s3://$R2_BUCKET/sources/osm/places/${SLUG}/" \
            --exclude "*" --include "*.json"
          # Persist the shared QID cache back. Every future run skips these.
          aws s3 cp work/wd-cache.json \
            "s3://$R2_BUCKET/sources/osm/wikidata-cache.json" \
            --content-type application/json
          if [ "$PUBLISH" = "true" ]; then
            for f in places.json demand-streets.json neighborhoods.json; do
              aws s3 cp "work/out/${SLUG}/$f" \
                "s3://globe/data/${SLUG}-2d/$f" --content-type application/json
            done
          else
            echo "staged only (publish=false)"
          fi
          rm -rf work/source.osm.pbf work/city.osm.pbf

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-2d-${{ matrix.city.slug }}
          path: artifact/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: cat "work/out/${SLUG}/_manifest.json" 2>/dev/null || echo "no manifest"

  # Rebuild the astrogl site's *-city-atlas / *-expensive-suburbs pages after the
  # data lands.
  #
  # The pages fetch /data/<slug>-2d/*.json at RUNTIME through the site Worker, so
  # a data-only change is already live the moment the upload lands and this step
  # is strictly redundant for correctness. It exists because a rebuild also
  # re-prerenders the atlas HTML, so a newly enrolled city shows up in the page
  # shell, the sitemap and the prerendered routes rather than only in the data.
  #
  # Cloudflare Workers Builds normally fires on a git push; this posts to the
  # Builds API instead. Sequence: list triggers for the worker tag -> pick the
  # one that includes the branch -> POST a manual build.
  rebuild-site:
    needs: [plan, build]
    # Always on the weekly schedule; on a manual run unless rebuild_site=false.
    if: needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_site != false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SITE_TRIGGER_UUID: ${{ vars.SITE_TRIGGER_UUID }}
      SITE_BRANCH: preview
      API: https://api.cloudflare.com/client/v4
    steps:
      - name: Trigger a Workers Build for astrogl
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$SITE_TRIGGER_UUID" ]; then
            echo "::notice::CF_API_TOKEN / SITE_TRIGGER_UUID not configured — skipping the site rebuild"
            exit 0
          fi
          # A file, not an inline -d string: a shell mangles the embedded quotes
          # and the API answers 400 "Invalid request body".
          printf '{"branch":"%s","commit_message":"ayeeff/osm 2d data published","commit_author":"ayeeff/osm"}' \
            "$SITE_BRANCH" > body.json
          UUID=$(curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @body.json \
            "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/triggers/$SITE_TRIGGER_UUID/builds" \
            | tee resp.json | jq -r '.result.build_uuid // empty')
          if [ -z "$UUID" ]; then
            echo "::error::could not start a build: $(cat resp.json)"
            exit 1
          fi
          echo "queued build $UUID for $SITE_BRANCH"

      - name: Wait for the build and report
        run: |
          set -euo pipefail
          UUID=$(jq -r '.result.build_uuid' resp.json)
          for i in $(seq 1 60); do
            sleep 30
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
              "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/builds/$UUID" > poll.json
            STATUS=$(jq -r '.result.status // "unknown"' poll.json)
            OUTCOME=$(jq -r '.result.build_outcome // "-"' poll.json)
            echo "[$i] $STATUS / $OUTCOME"
            if [ "$STATUS" = "stopped" ] || [ "$STATUS" = "error" ]; then
              if [ "$OUTCOME" = "success" ]; then exit 0; fi
              echo "::error::build $UUID finished with outcome=$OUTCOME"
              curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
                "$API/accounts/${{ secrets.CF_ACCOUNT_ID }}/builds/builds/$UUID/logs" \
                | jq -r '.result.lines[-25:][]?[1]' || true
              exit 1
            fi
          done
          echo "::notice::build $UUID still running after 30 min — leaving it to finish"
